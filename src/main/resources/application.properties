# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:5432/meridian
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration (if using Spring Data JPA)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Configuration
# Note: The JWT secret must be provided via environment variables and is not hardcoded here
# Example: export JWT_SECRET=your-production-secret
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000 